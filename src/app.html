    <!-- Shell loader: vanilla DOMContentLoaded fade — runs before Svelte mount -->
    <style>
      #app-shell-loader {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #fff;
      }
      #app-shell-loader .app-shell-loader__mark {
        width: 8rem;
        color: rgb(221, 221, 221);
        max-height: min(46vh, 400px);
        animation: app-shell-pulse 2s ease-in-out infinite alternate;
      }
      #app-shell-loader .app-shell-loader__mark img {
        display: block;
        width: 100%;
        height: auto;
        max-height: min(46vh, 400px);
      }
      @keyframes app-shell-pulse {
        from {
          opacity: 0;
        }
        to {
          opacity: 0.8;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #app-shell-loader .app-shell-loader__mark {
          animation: none;
          opacity: 1;
        }
      }
      #app-shell-loader .app-shell-loader__vh {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
    </style>
    <div
      id="app-shell-loader"
      aria-busy="true"
      aria-live="polite"
    >
      <span class="app-shell-loader__vh">Loading…</span>
      <div class="app-shell-loader__mark" aria-hidden="true">
        <img
          class="app-shell-loader__img"
          src="/loader-reef.webp"
          alt=""
          width="411"
          height="381"
          decoding="async"
          fetchpriority="high"
        />
      </div>
    </div>
    <script>
      (function () {
        var ID = 'app-shell-loader';
        var FADE_MS = 800;
        /** Minimum time the loader stays visible before the fade may start. */
        var MIN_VISIBLE_MS = 1200;
        var shellShownAt = performance.now();

        function markReady() {
          window.__appShellReady = true;
          window.dispatchEvent(new Event('app-shell-ready'));
        }

        function finish(el) {
          if (el && el.parentNode) {
            el.removeAttribute('aria-busy');
            el.style.display = 'none';
            el.style.pointerEvents = 'none';
            el.setAttribute('aria-hidden', 'true');
          }
          markReady();
        }

        var hideScheduled = false;

        function beginFade() {
          var el = document.getElementById(ID);
          if (!el) {
            markReady();
            return;
          }

          if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
            finish(el);
            return;
          }

          var done = false;

          function once() {
            if (done) return;
            done = true;
            finish(el);
          }

          el.style.opacity = '1';
          el.style.transition = 'opacity ' + FADE_MS + 'ms cubic-bezier(0.4, 0, 0.2, 1)';

          var t = window.setTimeout(once, FADE_MS + 250);

          el.addEventListener('transitionend', function onEnd(ev) {
            if (ev.propertyName !== 'opacity') return;
            window.clearTimeout(t);
            el.removeEventListener('transitionend', onEnd);
            once();
          });

          window.requestAnimationFrame(function () {
            window.requestAnimationFrame(function () {
              el.style.opacity = '0';
            });
          });
        }

        function hide() {
          if (hideScheduled) return;
          hideScheduled = true;

          var wait = Math.max(0, MIN_VISIBLE_MS - (performance.now() - shellShownAt));
          if (wait > 0) {
            window.setTimeout(beginFade, wait);
          } else {
            beginFade();
          }
        }

        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', hide, {
            once: true,
          });
        } else {
          hide();
        }
      })();
    </script>

    <div>%sveltekit.body%</div>
